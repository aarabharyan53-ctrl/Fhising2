<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:#0b0f19;color:#e8ecf4;font-size:14px}
  video.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2;z-index:0}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:15px;margin:0 0 12px;color:#9fb0cc;text-transform:uppercase;letter-spacing:.06em}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .card{background:rgba(18,24,38,.94);border:1px solid #24304a;border-radius:14px;padding:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select,textarea{background:#0f1524;border:1px solid #2c3a58;color:#fff;border-radius:9px;
        padding:9px 11px;font-size:14px;width:100%;font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  button{border:0;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;
         background:#3b82f6;color:#fff}
  button.gray{background:#2b3650}
  button.red{background:#b23b3b}
  button.green{background:#2f8f5b}
  button:disabled{opacity:.5;cursor:not-allowed}
  .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1d2740}
  .stat:last-child{border:0}
  .pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
  .on{background:#1e4d33;color:#7ee2a8}
  .off{background:#4d1e1e;color:#ff9b9b}
  .muted{color:#8b9ab5;font-size:12px}
  #logs{height:260px;overflow:auto;background:#080c15;border:1px solid #1d2740;border-radius:10px;
        padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5}
  .lv-INFO{color:#8ec9ff}.lv-WARN{color:#ffd479}.lv-ERROR{color:#ff8080}
  .ad{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #1d2740;border-radius:9px;margin-bottom:8px}
  .ad .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast{position:fixed;bottom:18px;right:18px;background:#16213a;border:1px solid #2c3a58;
         padding:11px 16px;border-radius:10px;z-index:9;display:none}
  .media img,.media video{max-width:100%;border-radius:10px;margin-top:8px}
  a{color:#7fb2ff}
</style>
</head>
<body>
{% if bg_video %}<video class="bg" src="{{ bg_video }}" autoplay muted loop playsinline></video>{% endif %}
<div class="wrap">
  <h1>Nexa Admin</h1>
  <p class="muted"><a href="{{ url_for('admin.admin_stats_page') }}">Users &amp; Stats</a> &nbsp;|&nbsp;
     <a href="{{ url_for('admin.logout') }}">Logout</a></p>

  <div class="grid">
    <div class="card">
      <h2>Status</h2>
      <div class="stat"><span>Broadcast</span><span id="s-ads" class="pill off">-</span></div>
      <div class="stat"><span>Broadcaster thread</span><span id="s-thread" class="pill off">-</span></div>
      <div class="stat"><span>Interval</span><span id="s-int">-</span></div>
      <div class="stat"><span>Subscribed users</span><span id="s-subs">-</span></div>
      <div class="stat"><span>Due now</span><span id="s-due">-</span></div>
      <div class="stat"><span>Active sessions</span><span id="s-live">-</span></div>
      <div class="row" style="margin-top:12px">
        <button id="btn-toggle" class="green">Toggle Broadcast</button>
        <button id="btn-now" class="gray">Broadcast Now</button>
        <button id="btn-refresh" class="gray">Refresh</button>
      </div>
    </div>

    <div class="card">
      <h2>Checks</h2>
      <div id="checks" class="muted">loading...</div>
      <h2 style="margin-top:14px">Interval</h2>
      <div class="row">
        <input id="interval" type="number" min="{{ config.limits.min if config.limits else 1 }}"
               value="{{ (config.interval or 1800) // 60 }}" style="width:110px">
        <button id="btn-int">Save</button>
      </div>
    </div>

    <div class="card">
      <h2>Caption</h2>
      <textarea id="caption" placeholder="Message caption">{{ config.caption or '' }}</textarea>
      <label class="muted" style="display:block;margin:8px 0">
        <input type="checkbox" id="caption_html" style="width:auto"
               {% if config.caption_is_html %}checked{% endif %}> HTML caption
      </label>
      <button id="btn-caption">Save Caption</button>
    </div>

    <div class="card">
      <h2>Media</h2>
      <div class="muted" id="media-name">none</div>
      <div class="media" id="media-box"></div>
      <div class="row" style="margin-top:10px">
        <input type="file" id="media-file" accept="image/*,video/*">
        <button id="btn-upload">Upload</button>
        <button id="btn-remove" class="red">Remove</button>
      </div>
      <label class="muted" style="display:block;margin-top:10px">
        <input type="checkbox" id="delete_after" style="width:auto"
               {% if config.delete_after_round %}checked{% endif %}> Delete previous ad before next send
      </label>
    </div>

    <div class="card">
      <h2>Link Ads</h2>
      <div id="ads"></div>
      <div class="row" style="margin-top:8px">
        <input id="ad-text" placeholder="Button text" style="flex:1">
        <input id="ad-url" placeholder="https://..." style="flex:2">
        <button id="btn-add">Add</button>
      </div>
    </div>

    <div class="card">
      <h2>Web Videos</h2>
      <div id="videos"></div>
      <div class="row" style="margin-top:8px">
        <input id="vid-url" placeholder="https://...mp4" style="flex:1">
        <button id="btn-vid-add">Add</button>
        <button id="btn-vid-save" class="gray">Save</button>
      </div>
    </div>

    <div class="card" style="grid-column:1/-1">
      <h2>Logs</h2>
      <div class="row" style="margin-bottom:8px">
        <select id="log-level" style="width:auto">
          <option value="all">all</option><option value="INFO">info</option>
          <option value="WARN">warn</option><option value="ERROR">error</option>
        </select>
        <button id="btn-clear-logs" class="gray">Clear Logs</button>
        <button id="btn-clear-msgs" class="red">Clear Sent Messages</button>
        <button id="btn-reset" class="red">Reset Ads Config</button>
      </div>
      <div id="logs"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CSRF = {{ csrf|tojson }};
let lastLogId = 0;

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = ok ? '#2f8f5b' : '#b23b3b';
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.display = 'none'; }, 3000);
}

async function api(path, method, body, isForm) {
  const opt = { method: method || 'GET', headers: { 'X-CSRF-Token': CSRF } };
  if (body !== undefined && body !== null) {
    if (isForm) { opt.body = body; }
    else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  }
  const r = await fetch('/admin' + path, opt);
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.success === false) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function pill(el, on) {
  el.textContent = on ? 'ON' : 'OFF';
  el.className = 'pill ' + (on ? 'on' : 'off');
}

async function loadDiag() {
  const d = await api('/api/diagnostics');
  document.getElementById('s-subs').textContent = d.subscribed;
  document.getElementById('s-due').textContent = d.due_now;
  pill(document.getElementById('s-ads'), d.ads_enabled);
  pill(document.getElementById('s-thread'), d.broadcaster_running);
  document.getElementById('s-int').textContent = d.interval_minutes + ' min';
  document.getElementById('checks').innerHTML = d.checks.map(c =>
    '<div class="stat"><span>' + (c.ok ? 'OK  ' : 'FAIL') + ' ' + c.label + '</span>' +
    '<span class="muted">' + (c.detail || '') + '</span></div>').join('');
}

async function loadStats() {
  const s = await api('/api/stats/refresh');
  document.getElementById('s-live').textContent = s.active_sessions ?? '-';
}

function renderAds(ads) {
  document.getElementById('ads').innerHTML = ads.length ? '' : '<p class="muted">no links yet</p>';
  ads.forEach(a => {
    const div = document.createElement('div');
    div.className = 'ad';
    div.innerHTML = '<span class="t">' + a.text + '<br><span class="muted">' + a.url + '</span></span>' +
      '<span class="pill ' + (a.enabled ? 'on' : 'off') + '">' + (a.enabled ? 'ON' : 'OFF') + '</span>';
    const bT = document.createElement('button');
    bT.className = 'gray'; bT.textContent = a.enabled ? 'Disable' : 'Enable';
    bT.onclick = async () => {
      try { const r = await api('/api/ads/' + a.id, 'PUT', { text: a.text, url: a.url, enabled: !a.enabled });
            renderAds(r.ads); toast('updated', true); } catch (e) { toast(e.message); }
    };
    const bE = document.createElement('button');
    bE.className = 'gray'; bE.textContent = 'Edit';
    bE.onclick = async () => {
      const t = prompt('Text', a.text); if (t === null) return;
      const u = prompt('URL', a.url); if (u === null) return;
      try { const r = await api('/api/ads/' + a.id, 'PUT', { text: t, url: u, enabled: a.enabled });
            renderAds(r.ads); toast('updated', true); } catch (e) { toast(e.message); }
    };
    const bD = document.createElement('button');
    bD.className = 'red'; bD.textContent = 'X';
    bD.onclick = async () => {
      try { const r = await api('/api/ads/' + a.id, 'DELETE'); renderAds(r.ads); toast('deleted', true); }
      catch (e) { toast(e.message); }
    };
    div.append(bT, bE, bD);
    document.getElementById('ads').appendChild(div);
  });
}

function renderVideos(vids) {
  document.getElementById('videos').innerHTML = vids.length ? '' : '<p class="muted">none</p>';
  vids.forEach((v, i) => {
    const div = document.createElement('div');
    div.className = 'ad';
    div.innerHTML = '<span class="t">' + v.url + '</span>';
    const b = document.createElement('button');
    b.className = 'red'; b.textContent = 'X';
    b.onclick = () => { vids.splice(i, 1); renderVideos(vids); };
    div.appendChild(b);
    document.getElementById('videos').appendChild(div);
  });
}

function renderMedia(d) {
  const box = document.getElementById('media-box');
  const nameEl = document.getElementById('media-name');
  box.innerHTML = '';
  if (!d.media_file) { nameEl.textContent = 'none'; return; }
  nameEl.textContent = d.media_file + ' (' + d.media_type + ')';
  const url = '/admin/uploads/' + encodeURIComponent(d.media_file);
  if (d.media_type === 'video') {
    const v = document.createElement('video');
    v.src = url; v.controls = true; v.muted = true; box.appendChild(v);
  } else {
    const im = document.createElement('img'); im.src = url; box.appendChild(im);
  }
}

function addLog(l) {
  const box = document.getElementById('logs');
  const div = document.createElement('div');
  div.className = 'lv-' + (l.level || 'INFO');
  div.textContent = '[' + (l.time || l.ts || '') + '] ' + (l.level || '') + ' ' + (l.msg || l.message || '');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  if (l.id) lastLogId = Math.max(lastLogId, l.id);
}

async function pollLogs() {
  try {
    const level = document.getElementById('log-level').value;
    const d = await api('/api/logs?since=' + lastLogId + '&level=' + level);
    (d.logs || []).forEach(addLog);
  } catch (e) {}
}

async function loadConfig() {
  const d = await api('/api/config');
  renderAds(d.ads);
  renderVideos(d.videos || []);
  renderMedia(d);
  document.getElementById('interval').value = d.interval_minutes;
  document.getElementById('caption').value = d.caption || '';
  document.getElementById('caption_html').checked = !!d.caption_is_html;
  document.getElementById('delete_after').checked = !!d.delete_after_round;
}

document.getElementById('btn-toggle').onclick = async () => {
  try { const r = await api('/api/toggle-ads', 'POST'); toast(r.message, true); loadDiag(); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-now').onclick = async () => {
  try { const r = await api('/api/broadcast-now', 'POST'); toast(r.message, true); loadDiag(); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-refresh').onclick = () => { loadDiag(); loadStats(); };
document.getElementById('btn-int').onclick = async () => {
  try {
    const r = await api('/api/set-interval', 'POST', { interval: document.getElementById('interval').value });
    toast(r.message, true); loadDiag();
  } catch (e) { toast(e.message); }
};
document.getElementById('btn-caption').onclick = async () => {
  try {
    const r = await api('/api/set-caption', 'POST', {
      caption: document.getElementById('caption').value,
      caption_is_html: document.getElementById('caption_html').checked,
    });
    toast(r.message, true);
  } catch (e) { toast(e.message); }
};
document.getElementById('btn-add').onclick = async () => {
  try {
    const r = await api('/api/ads', 'POST', {
      text: document.getElementById('ad-text').value,
      url: document.getElementById('ad-url').value,
    });
    renderAds(r.ads);
    document.getElementById('ad-text').value = '';
    document.getElementById('ad-url').value = '';
    toast(r.message, true);
  } catch (e) { toast(e.message); }
};
document.getElementById('btn-upload').onclick = async () => {
  const f = document.getElementById('media-file').files[0];
  if (!f) return toast('pick a file');
  const fd = new FormData();
  fd.append('photo', f);
  fd.append('csrf', CSRF);
  try { const r = await api('/api/upload-photo', 'POST', fd, true); toast(r.message, true); loadConfig(); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-remove').onclick = async () => {
  try { const r = await api('/api/remove-photo', 'POST'); toast(r.message, true); loadConfig(); }
  catch (e) { toast(e.message); }
};
document.getElementById('delete_after').onchange = async () => {
  try { const r = await api('/api/toggle-delete-after-round', 'POST'); toast(r.message, true); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-vid-add').onclick = () => {
  const vids = Array.from(document.querySelectorAll('#videos .ad .t')).map(e => ({ url: e.textContent }));
  const u = document.getElementById('vid-url').value.trim();
  if (u) { vids.push({ url: u }); document.getElementById('vid-url').value = ''; renderVideos(vids); }
};
document.getElementById('btn-vid-save').onclick = async () => {
  const vids = Array.from(document.querySelectorAll('#videos .ad .t')).map(e => ({ url: e.textContent }));
  try { const r = await api('/api/videos', 'POST', { videos: vids }); toast(r.message, true); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-clear-logs').onclick = async () => {
  try { const r = await api('/api/logs/clear', 'POST'); document.getElementById('logs').innerHTML = ''; toast(r.message, true); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-clear-msgs').onclick = async () => {
  try { const r = await api('/api/clear-messages', 'POST'); toast('cleared ' + r.cleared_count, true); }
  catch (e) { toast(e.message); }
};
document.getElementById('btn-reset').onclick = async () => {
  if (!confirm('Reset ads config to defaults?')) return;
  try { const r = await api('/api/reset-ads', 'POST'); toast(r.message, true); loadConfig(); loadDiag(); }
  catch (e) { toast(e.message); }
};

{% if initial_logs %}({{ initial_logs|tojson }}).forEach(addLog);{% endif %}

loadConfig().catch(e => toast(e.message));
loadDiag().catch(() => {});
loadStats().catch(() => {});
setInterval(loadStats, 10000);
setInterval(loadDiag, 20000);
setInterval(pollLogs, 2500);
</script>
</body>
</html>
