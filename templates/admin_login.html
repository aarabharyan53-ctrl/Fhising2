<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0f19;color:#e8ecf4}
  video.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;z-index:0}
  .card{position:relative;z-index:1;width:min(360px,92vw);padding:28px;border-radius:16px;
        background:rgba(18,24,38,.92);border:1px solid #24304a;backdrop-filter:blur(8px)}
  h1{margin:0 0 18px;font-size:20px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2c3a58;
        background:#0f1524;color:#fff;font-size:15px;margin-bottom:12px}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#3b82f6;color:#fff;
         font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#2f6fd8}
  .err{color:#ff7b7b;font-size:14px;margin:0 0 12px}
</style>
</head>
<body>
{% if bg_video %}<video class="bg" src="{{ bg_video }}" autoplay muted loop playsinline></video>{% endif %}
<main class="card">
  <h1>Admin Panel</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin.login') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Login</button>
  </form>
</main>
</body>
</html>
